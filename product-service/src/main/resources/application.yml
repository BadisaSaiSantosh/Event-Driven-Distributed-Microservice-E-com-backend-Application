server:
  port: 8082 # The API Gateway routes /products/** to port 8082

spring:
  application:
    name: product-service
  
  # Database configuration (Assuming PostgreSQL as the standard)
  datasource:
    url: jdbc:postgresql://localhost:5432/productdb
    username: postgres
    password: password
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    secret: MySuperSecretKeyForJwtSigningDontUseInProd

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0