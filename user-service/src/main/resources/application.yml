server:
  port: 8081

spring:
  application:
    name: user-service

    jwt:
        secret: my-secret-key
        expiration: 3600000 

    postgress:
        url: jdbc:postgresql://localhost:5432/userdb
        username: postgres
        password: password

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect    
