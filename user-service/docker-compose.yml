version: '3.8'
services:
  user-mongodb:
    image: mongo:6.0
    container_name: local-user-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  user-service:
    build: .
    container_name: local-user-service
    ports:
      - '8081:8081'
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:password@user-mongodb:27017/userdb?authSource=admin
    depends_on:
      - user-mongodb